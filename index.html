<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sequoia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sequoia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F0E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F2731" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<section id="view-today"><div class="wrap"><header class="top"><div class="eyebrow">Sequoia</div><h1>Getting your day ready</h1></header></div></section>
<section id="view-workout" hidden></section>
<section id="view-library" hidden></section>
<section id="view-coach" hidden></section>
<section id="view-progress" hidden></section>
<section id="view-settings" hidden></section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="pull" id="pull" role="status" hidden></div>
<div class="dock" id="dock" hidden>
  <div class="dock-ask" id="dockAsk" hidden>
    <div class="dock-label" id="dockAskLabel">How did that set feel?</div>
    <div class="ask-btns"><button type="button" data-ask="easy">Too easy</button><button type="button" data-ask="right">Just right</button><button type="button" data-ask="hard">Too hard</button></div>
    <p id="dockAdvice" hidden></p>
  </div>
  <div class="dock-in" id="dockTimer">
    <div><div class="dock-label" id="dockLabel">Rest</div><div class="dock-time" id="dockTime">1:30</div></div>
    <div class="dock-btns"><button type="button" id="plus15">+15 sec</button><button type="button" id="skip">Skip</button></div>
    <div class="dock-track"><i id="dockFill"></i></div>
  </div>
</div>

<a class="leaf" id="open-settings" href="#settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5C4.5 10.5 10 5 19.5 4.5 19.5 14 14 19.5 4.5 19.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4.5 19.5C8 14 11 11 15.5 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a>
<nav class="tabs" aria-label="Sections">
  <a href="#today" id="tab-today" class="on">Today</a>
  <a href="#library" id="tab-library">Library</a>
  <a href="#coach" id="tab-coach">Coach</a>
  <a href="#progress" id="tab-progress">Progress</a>
</nav>

<script type="module" src="js/app.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
